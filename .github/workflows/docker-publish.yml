name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Запуск при пуше в main
  pull_request:
    branches:
      - main  # Также при PR в main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клонируем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Логинимся в Docker Hub (или GHCR)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Собираем Docker-образ
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/song-info:latest ./songInfo
      
      # 4️⃣ Пушим образ в реестр
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/song-info:latest
