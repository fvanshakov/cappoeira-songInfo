name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Запуск при пуше в main
  pull_request:
    branches:
      - main  # Также при PR в main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1 Клонируем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 Устанавливаем JDK для сборки проекта
      - name: Установка JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3 Настраиваем Gradle для сборки проекта
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 4 Собираем проект
      - name: Build with Gradle Wrapper
        run: cd ./songInfo ; ./gradlew build

      # 5 Прогоняем тесты
      - name: Run tests with Gradle
        run: cd ./songInfo ; ./gradlew test

      # 6 Логинимся в Docker Hub (или GHCR)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7 Собираем Docker-образ
      - name: Build Docker image
        run: |
          cd ./songInfo
          ./gradlew build
          cd ..
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/song-info:latest ./songInfo
      
      # 8 Пушим образ в реестр
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/song-info:latest
